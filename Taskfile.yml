version: '3'

vars:
  BIN_DIR: '{{.ROOT_DIR}}/bin'
  KEYS_DIR: '{{.ROOT_DIR}}/keys'
  SITE_DIR: '{{.ROOT_DIR}}/site'
  LDFLAGS: '-s -w'
  # AGENT_VERSION: semver injected into cmd/edge-agent at build time.
  # Falls back to `0.0.0-dev` when `git describe` can't find a tag.
  AGENT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build both binaries (static, CGO_ENABLED=0)
    deps: [build-server, build-agent]

  build-agent:
    desc: Build the edge-agent binary (static, semver injected via ldflags)
    cmds:
      - CGO_ENABLED=0 go build -ldflags="{{.LDFLAGS}} -X main.version={{.AGENT_VERSION}}" -o {{.BIN_DIR}}/edge-agent ./cmd/edge-agent
    generates:
      - '{{.BIN_DIR}}/edge-agent'

  build-server:
    desc: Build the update-server binary (static)
    cmds:
      - CGO_ENABLED=0 go build -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/update-server ./cmd/update-server
    generates:
      - '{{.BIN_DIR}}/update-server'

  keygen:
    desc: Generate Ed25519 keypair (server.key + agent.pub) into ./keys
    cmds:
      - go run ./tools/keygen -out {{.KEYS_DIR}}

  test:
    desc: Run the full test suite with race detector (excludes integration tag)
    cmds:
      - go test ./... -race -count=1

  test-integration:
    desc: Run end-to-end integration tests (requires the `integration` build tag)
    cmds:
      - go test -tags integration ./integration/... -race -count=1 -v

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  check:
    desc: Quick local check (vet + full build, no tests)
    cmds:
      - go vet ./...
      - go build ./...

  ci:
    desc: Full local CI - vet, test, build both binaries
    cmds:
      - task: vet
      - task: test
      - task: build-server
      - task: build-agent

  docs-serve:
    desc: Serve the documentation site locally with live reload (hugo extended required)
    dir: '{{.SITE_DIR}}'
    cmds:
      - hugo server --buildDrafts --disableFastRender

  docs-build:
    desc: Build the documentation site into site/public
    dir: '{{.SITE_DIR}}'
    cmds:
      - hugo --gc --minify --printPathWarnings

  docs-diagrams:
    desc: Parse every mermaid diagram against the exact version the theme ships
    dir: '{{.SITE_DIR}}'
    cmds:
      # Needs the theme on disk to read its bundled mermaid version.
      - hugo mod vendor
      - node tools/check-diagrams.mjs
      - rm -rf _vendor

  docs-check:
    desc: Build the docs, validate the diagrams, and assert they reached the HTML
    dir: '{{.SITE_DIR}}'
    cmds:
      - task: docs-diagrams
      - hugo --gc --minify
      - test -f public/index.html
      # A theme upgrade that changes the mermaid render hook would otherwise
      # ship a site full of raw code blocks with a green build.
      - grep -rq 'class="mermaid' public/ || (echo "no mermaid diagrams in output" && exit 1)
      - echo "docs OK - $(find public -name index.html | wc -l) pages"

  clean:
    desc: Remove build artifacts, cached deltas and the generated site
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf {{.ROOT_DIR}}/store/deltas
      - rm -rf {{.SITE_DIR}}/public {{.SITE_DIR}}/resources
