baseURL = 'https://carlosprados.github.io/ota-updater/'
# Hugo 0.158 renamed languageCode -> locale.
locale = 'en-US'
defaultContentLanguage = 'en'
title = 'OTA Updater'

# Relearn is pulled as a Hugo Module, pinned to an exact commit in go.mod.
# The upstream repo tags releases as "7.x.x" without the leading "v", so the
# Go module proxy sees no semver tags and resolves to a pseudo-version. That
# is fine — arguably better: the build is reproducible down to the commit.
theme = ['github.com/McShelby/hugo-theme-relearn']

# Generated into ./public by the release workflow.
publishDir = 'public'

# Relearn renders section landing pages from _index.md; without this, Hugo
# emits "/section/index.html" links that break on GitHub Pages' trailing-slash
# handling for some paths.
disablePathToLower = false
enableGitInfo = false

[module]
  [[module.imports]]
    path = 'github.com/McShelby/hugo-theme-relearn'

[markup]
  [markup.goldmark.parser.attribute]
    # Relearn's `children` shortcode ends its output with a Goldmark block
    # attribute line — `{class="children children-type-tree …"}`. With block
    # attributes off, Goldmark has no idea what that is and renders it as
    # prose: the home page's "Where to go next" list ended with a literal
    # `{class="children children-type-tree children-sort-"}`, smart-quotes and
    # all. Nothing else in this site's content uses the syntax; it is on
    # because the theme's own markup requires it.
    block = true

  [markup.goldmark.renderer]
    # Needed for the few inline <br> and <sup> tags used in wide tables.
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'github'
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # Light + dark, following the reader's OS preference. Relearn switches
  # mermaid's own palette along with the page.
  #
  # One variant, dark, matching carlos.enredando.me. The blog ships an
  # appearance switcher but only ever styles its dark side, so offering a
  # light option here would advertise a look the family does not have. A
  # single entry also makes Relearn drop the switcher from the sidebar
  # instead of leaving a control with nothing to choose between.
  themeVariant = [
    { identifier = 'enredando', name = 'Enredando' },
  ]

  # Diagrams are fixed images: no wheel-zoom, no drag-to-pan, no reset
  # button. Relearn implements all three by adding a `zoomable` class to the
  # container, so switching this off removes the behaviour rather than
  # merely hiding its affordances. Wide diagrams scroll inside their own box
  # (see .mermaid-container in enredando-skin.css) instead of being panned.
  mermaidZoom = false

  disableLandingPageButton = true
  disableBreadcrumb = false
  disableNextPrev = false
  disableToc = false
  collapsibleMenu = true
  alwaysopen = false
  editURL = 'https://github.com/carlosprados/ota-updater/edit/main/site/content/'

  # Injected by the release workflow from the git tag, so every published
  # build states which release it documents instead of silently drifting.
  release = 'dev'

  # Passed verbatim to mermaid.initialize(). `theme` is deliberately absent:
  # Relearn strips it and substitutes the variant's --MERMAID-theme, so
  # setting it here would be silently ignored. themeVariables survive, which
  # is what re-tints the diagrams to the blog's palette instead of mermaid's
  # own dark defaults — the greys it picks for subgraphs are opaque and cut
  # visible rectangles out of the page grid.
  #
  # `themeVariables.fontSize` has to be 16px, and that is not a style choice.
  # This was the actual cause of the text escaping its boxes on this site — the
  # diagram sources were fine. The sequence renderer sizes its note and message
  # boxes from this value but writes `font-size: 16px` into the <text> it
  # paints, so at 14px every box was measured 14% narrower than the glyphs
  # drawn into it and the tail of each label landed outside. Verified by
  # driving the per-diagram `sequence.*FontSize` keys to 12 and 16: the painted
  # size never moved off 16px and the boxes never changed, which is what rules
  # those keys out as the lever and points at this one.
  #
  # `sequence.width` is the participant box, which is a FIXED width rather than
  # a measured one — mermaid will not grow it for a long participant name. 190
  # fits the longest one here ("disk (A/B slots)") at 16px mono; a longer name
  # than that needs this raised or the name shortened, because no amount of
  # font configuration will make the box follow the text.
  #
  # Keep this a single-line-per-string JSON document. Relearn hands it to
  # JSON.parse in the browser, and JSON forbids literal newlines inside a
  # string: a multi-line comment value here throws, themeUseMermaid is never
  # assigned, and every diagram on the site silently stops rendering. Comments
  # belong out here in TOML, where they cost nothing.
  mermaidInitialize = '''
    {
      "flowchart": { "useMaxWidth": true, "htmlLabels": true, "curve": "basis" },
      "sequence": { "useMaxWidth": true, "width": 190 },
      "themeVariables": {
        "fontFamily": "JetBrains Mono, ui-monospace, SFMono-Regular, menlo, monospace",
        "fontSize": "16px",
        "background": "#04070c",
        "mainBkg": "#0f1520",
        "primaryColor": "#0f1520",
        "primaryTextColor": "#e6edf7",
        "primaryBorderColor": "#38bdf8",
        "secondaryColor": "#151d2b",
        "secondaryTextColor": "#e6edf7",
        "secondaryBorderColor": "#6b7687",
        "tertiaryColor": "#0a0f16",
        "tertiaryTextColor": "#aab4c4",
        "tertiaryBorderColor": "rgba(148,180,220,0.18)",
        "lineColor": "#6b7687",
        "textColor": "#aab4c4",
        "titleColor": "#e6edf7",
        "nodeBorder": "#38bdf8",
        "nodeTextColor": "#e6edf7",
        "clusterBkg": "rgba(148,180,220,0.04)",
        "clusterBorder": "rgba(148,180,220,0.18)",
        "edgeLabelBackground": "#0a0f16",
        "labelBackground": "#0a0f16",
        "labelBoxBkgColor": "#0f1520",
        "labelBoxBorderColor": "#38bdf8",
        "labelTextColor": "#e6edf7",
        "noteBkgColor": "rgba(251,191,36,0.10)",
        "noteBorderColor": "#fbbf24",
        "noteTextColor": "#e6edf7",
        "actorBkg": "#0f1520",
        "actorBorder": "#38bdf8",
        "actorTextColor": "#e6edf7",
        "actorLineColor": "#4a5466",
        "signalColor": "#aab4c4",
        "signalTextColor": "#aab4c4",
        "sequenceNumberColor": "#04070c",
        "activationBkgColor": "#151d2b",
        "activationBorderColor": "#38bdf8",
        "classText": "#e6edf7",
        "attributeBackgroundColorOdd": "#0a0f16",
        "attributeBackgroundColorEven": "#0f1520",
        "transitionColor": "#aab4c4",
        "transitionLabelColor": "#aab4c4",
        "stateBkg": "#0f1520",
        "stateLabelColor": "#e6edf7",
        "altBackground": "#0a0f16",
        "compositeBackground": "rgba(148,180,220,0.04)",
        "compositeBorder": "rgba(148,180,220,0.18)",
        "compositeTitleBackground": "rgba(56,189,248,0.08)",
        "innerEndBackground": "#151d2b",
        "specialStateColor": "#38bdf8",
        "errorBkgColor": "rgba(248,113,113,0.12)",
        "errorTextColor": "#f87171"
      }
    }
  '''

  [params.mermaid]
    # Loads the mermaid bundle on every page rather than only where a diagram
    # was detected. Kept on because the diagrams are the point of this site
    # and the include shortcode can pull one into a page that has none of its
    # own, which the detection misses.
    force = true

# Relearn 7 builds its own search index; declaring a SEARCH output format
# here is unsupported and warns at build time.
[outputs]
  home = ['HTML', 'RSS']

[[menu.shortcuts]]
  name = "<i class='fab fa-fw fa-github'></i> GitHub repo"
  identifier = 'ghrepo'
  url = 'https://github.com/carlosprados/ota-updater'
  weight = 10

[[menu.shortcuts]]
  name = "<i class='fas fa-fw fa-scale-balanced'></i> Apache-2.0"
  url = 'https://github.com/carlosprados/ota-updater/blob/main/LICENSE'
  weight = 20

[[menu.shortcuts]]
